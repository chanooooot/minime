<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#ffffff">
    <meta name="description" content="บทสนทนาสั้น ๆ กับ minime">
    <title>minime</title>
    <link rel="stylesheet" href="styles.css?v=4">
  </head>
  <body>
    <main class="stage">
      <section class="mascot-scene" aria-label="minime mascot">
        <div class="speech-bubble" aria-live="polite">
          <p id="message">กกต.หค.</p>
        </div>
        <div class="mascot" role="img" aria-label="Animated minime cat mascot"></div>
        <div class="actions" role="group" aria-label="Page actions">
          <button class="button button-primary" id="talkButton" type="button" lang="en">Talk</button>
          <button class="button button-secondary" id="shareButton" type="button" lang="en">Share</button>
        </div>
      </section>
      <p class="status" id="shareStatus" role="status"></p>
    </main>
    <script src="script.js?v=2"></script>
  </body>
</html>
